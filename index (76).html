<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pilkades Baleharjo 2027</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #FAFAF6;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  #frame-wrap { position: fixed; inset: 0; }
  #app-frame {
    width: 100%; height: 100%; border: 0; display: block;
    opacity: 0; transition: opacity .35s ease;
  }
  #app-frame.ready { opacity: 1; }

  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #FAFAF6; transition: opacity .3s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #e7e5e4; border-top-color: #57534e;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { color: #78716c; font-size: 13px; margin: 0; }

  #error-box {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #FAFAF6; padding: 24px; text-align: center;
  }
  #error-box.show { display: flex; }
  #error-box h1 { font-size: 16px; color: #292524; margin: 0; }
  #error-box p { font-size: 13px; color: #78716c; margin: 0; max-width: 360px; }
  #error-box a {
    margin-top: 6px; display: inline-block; padding: 8px 16px;
    background: #292524; color: #fff; border-radius: 8px;
    text-decoration: none; font-size: 13px;
  }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat aplikasi&hellip;</p>
  </div>

  <div id="error-box">
    <h1>Aplikasi tidak dapat dimuat</h1>
    <p>Periksa koneksi internet Anda, atau buka aplikasi langsung lewat tautan di bawah ini.</p>
    <a id="direct-link" href="#" target="_blank" rel="noopener">Buka Aplikasi Langsung</a>
  </div>

  <div id="frame-wrap">
    <iframe id="app-frame" title="Pilkades Baleharjo 2027" allow="clipboard-write"></iframe>
  </div>

  <script>
    // =====================================================================
    // GANTI URL DI BAWAH INI dengan URL Web App Google Apps Script Anda,
    // yaitu URL yang berakhiran "/exec" (bukan "/dev").
    // Contoh: https://script.google.com/macros/s/AKfycbxXXXXXXXXXXXX/exec
    // =====================================================================
    const GAS_APP_URL = "GANTI_DENGAN_URL_WEB_APP_GAS_ANDA";

    const frame = document.getElementById("app-frame");
    const loader = document.getElementById("loader");
    const errorBox = document.getElementById("error-box");
    const directLink = document.getElementById("direct-link");

    // Boleh override sementara lewat ?src= untuk keperluan tes tanpa ubah file.
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("src") || GAS_APP_URL;

    directLink.href = targetUrl;

    if (!targetUrl || targetUrl.indexOf("GANTI_DENGAN_URL") !== -1) {
      loader.classList.add("hide");
      errorBox.querySelector("h1").textContent = "URL aplikasi belum diatur";
      errorBox.querySelector("p").textContent =
        "Buka index.html lalu ganti nilai GAS_APP_URL dengan URL Web App Apps Script Anda.";
      errorBox.classList.add("show");
    } else {
      let settled = false;

      frame.addEventListener("load", function () {
        settled = true;
        loader.classList.add("hide");
        frame.classList.add("ready");
      });

      // Jika dalam 12 detik iframe belum juga "load" (mis. diblokir jaringan),
      // tampilkan pesan error dengan tautan langsung.
      setTimeout(function () {
        if (!settled) {
          loader.classList.add("hide");
          errorBox.classList.add("show");
        }
      }, 12000);

      frame.src = targetUrl;
    }
  </script>
</body>
</html>
