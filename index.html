<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pilkades Baleharjo 2027</title>
<meta name="robots" content="noindex" />

<!-- ===== Ikon Aplikasi E-Pilkades Baleharjo (favicon + PWA) ===== -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#E0301E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="E-Pilkades" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #FAFAF6;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  #frame-wrap { position: fixed; inset: 0; }
  #app-frame {
    width: 100%; height: 100%; border: 0; display: block;
    opacity: 0; transition: opacity .35s ease;
  }
  #app-frame.ready { opacity: 1; }

  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #FAFAF6; transition: opacity .3s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #e7e5e4; border-top-color: #57534e;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { color: #78716c; font-size: 13px; margin: 0; }

  #error-box {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #FAFAF6; padding: 24px; text-align: center;
  }
  #error-box.show { display: flex; }
  #error-box h1 { font-size: 16px; color: #292524; margin: 0; }
  #error-box p { font-size: 13px; color: #78716c; margin: 0; max-width: 360px; }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat aplikasi&hellip;</p>
  </div>

  <div id="error-box">
    <h1>Pengaturan belum lengkap</h1>
    <p>URL aplikasi belum diatur.</p>
  </div>

  <div id="frame-wrap">
    <iframe id="app-frame" title="Pilkades Baleharjo 2027" allow="clipboard-write"></iframe>
  </div>

  <script>
    // =====================================================================
    // GANTI URL DI BAWAH INI dengan URL Web App Google Apps Script Anda,
    // yaitu URL yang berakhiran "/exec" (bukan "/dev").
    // Contoh: https://script.google.com/macros/s/AKfycbxXXXXXXXXXXXX/exec
    // =====================================================================
    const GAS_APP_URL = "https://script.google.com/macros/s/AKfycbwYUDQs4bmwGYrShyMew-L8K-KhSb6P4HaT9nJN-TbqAygJPBXSrEo2nkOj11qGAcQl/exec";

    const frame = document.getElementById("app-frame");
    const loader = document.getElementById("loader");
    const loaderText = loader.querySelector("p");
    const errorBox = document.getElementById("error-box");

    // Boleh override sementara lewat ?src= untuk keperluan tes tanpa ubah file.
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("src") || GAS_APP_URL;

    if (!targetUrl || targetUrl.indexOf("GANTI_DENGAN_URL") !== -1) {
      loader.classList.add("hide");
      errorBox.querySelector("h1").textContent = "URL aplikasi belum diatur";
      errorBox.querySelector("p").textContent =
        "Buka index.html lalu ganti nilai GAS_APP_URL dengan URL Web App Apps Script Anda.";
      errorBox.classList.add("show");
    } else {
      // Muat otomatis; kalau iframe belum juga "load" dalam batas waktu
      // (jaringan lambat/putus, Apps Script sedang "cold start", dsb),
      // otomatis coba muat ulang sendiri — tanpa perlu klik apa pun dan
      // tanpa menampilkan pilihan buka manual.
      const BATAS_WAKTU_MS = 15000;
      let berhasil = false;
      let percobaan = 0;
      let timer = null;

      function muat() {
        if (berhasil) return;
        percobaan += 1;
        loaderText.textContent =
          percobaan === 1 ? "Memuat aplikasi\u2026" : "Menyambung ulang\u2026 (percobaan ke-" + percobaan + ")";
        // Parameter _r hanya penanda supaya browser benar-benar memuat ulang
        // (bukan memakai hasil gagal yang tersimpan); diabaikan oleh Apps Script.
        const pemisah = targetUrl.indexOf("?") === -1 ? "?" : "&";
        frame.src = percobaan === 1 ? targetUrl : targetUrl + pemisah + "_r=" + Date.now();
        clearTimeout(timer);
        timer = setTimeout(muat, BATAS_WAKTU_MS);
      }

      frame.addEventListener("load", function () {
        if (!frame.src || frame.src === "about:blank") return;
        berhasil = true;
        clearTimeout(timer);
        loader.classList.add("hide");
        frame.classList.add("ready");
      });

      // Begitu koneksi internet kembali, langsung coba lagi (tidak menunggu batas waktu).
      window.addEventListener("online", function () {
        if (!berhasil) muat();
      });

      muat();
    }
  </script>
</body>
</html>
